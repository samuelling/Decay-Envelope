<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#141617">
<title>Decay Envelope</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Major+Mono+Display&family=Spectral:ital,wght@0,400;1,300;1,400&display=swap">
<style>
/* Layout: one full-bleed canvas (the module panel is the world); HUD as a silkscreened rail on top; story cards are little faceplates screwed over the screen. Single dark look, by design. */
:root{
  --panel:#141617;      /* black anodized aluminium */
  --panel-2:#1d2022;
  --rail:#2a2d2f;
  --silk:#ebe6d9;       /* silkscreen ink */
  --silk-dim:#9b998f;
  --amber:#ffb547;      /* Otto's warm LED */
  --cold:#7fd3ff;       /* the scrollers' screen glow */
  --red:#d94a3a;        /* patch cable */
  --f-title:"Major Mono Display", ui-monospace, monospace;
  --f-label:"Barlow Condensed", "Arial Narrow", system-ui, sans-serif;
  --f-voice:"Spectral", Georgia, "Times New Roman", serif;
  color-scheme:dark;
}
html,body{height:100%;margin:0;background:var(--panel);color:var(--silk);overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;background:var(--panel)}

#hud{position:fixed;left:0;right:0;top:0;padding:calc(env(safe-area-inset-top,0px) + 8px) 16px 8px;display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;
  background:linear-gradient(var(--rail),rgba(42,45,47,.86));border-bottom:1px solid #000;font-family:var(--f-label);text-transform:uppercase;letter-spacing:.08em;font-size:13px;font-weight:600;pointer-events:none}
#hud[hidden]{display:none!important}
#mod{white-space:nowrap}
#mod b{color:var(--amber);font-weight:700}
#meter{min-width:0;display:grid;gap:3px}
#meterTxt{font-variant-numeric:tabular-nums;color:var(--silk-dim);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#meterTxt b{color:var(--silk)}
#bar{height:6px;background:#0b0c0d;border:1px solid #000;border-radius:3px;overflow:hidden}
#fill{height:100%;width:0;background:var(--amber);box-shadow:0 0 8px var(--amber);transition:width .15s}
#fill.ready{background:var(--red);box-shadow:0 0 10px var(--red)}
#right{display:flex;gap:10px;align-items:center;pointer-events:auto}
#tally{font-variant-numeric:tabular-nums;color:var(--silk-dim);font-size:12px;text-align:right;line-height:1.15}
#tally span{color:var(--silk)}
#mute{appearance:none;border:1px solid var(--silk-dim);background:transparent;color:var(--silk);font:inherit;font-size:11px;letter-spacing:.1em;padding:4px 7px;border-radius:3px;cursor:pointer}
#mute:focus-visible,.jack:focus-visible{outline:2px solid var(--amber);outline-offset:3px}

#caption{position:fixed;left:16px;right:16px;bottom:calc(env(safe-area-inset-bottom,0px) + 18px);max-width:560px;margin:0 auto;padding:12px 16px 13px;
  background:rgba(12,13,14,.88);border:1px solid #33373a;border-left:3px solid var(--amber);border-radius:2px;pointer-events:none;
  opacity:0;transform:translateY(8px);transition:opacity .35s,transform .35s}
#caption.on{opacity:1;transform:none}
#caption.cold{border-left-color:var(--cold)}
#who{font-family:var(--f-label);font-weight:700;text-transform:uppercase;letter-spacing:.14em;font-size:11px;color:var(--amber);margin-bottom:3px}
#caption.cold #who{color:var(--cold)}
#line{font-family:var(--f-voice);font-style:italic;font-weight:300;font-size:17px;line-height:1.38}
#caption.cold #line{font-style:normal;font-family:var(--f-label);font-weight:500;font-size:16px;letter-spacing:.02em}

#veil{position:fixed;inset:0;display:grid;place-items:center;padding:16px;background:rgba(8,9,10,.72);overflow:auto}
#veil[hidden]{display:none!important}
.card{position:relative;width:100%;max-width:400px;background:linear-gradient(160deg,var(--panel-2),var(--panel));border:1px solid #000;border-radius:3px;
  box-shadow:0 0 0 1px #2c3033 inset,0 30px 60px rgba(0,0,0,.6);padding:34px 26px 26px;display:grid;gap:14px}
.card::before,.card::after{content:"";position:absolute;top:10px;width:9px;height:9px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#8d9093,#3b3e40 70%);box-shadow:0 0 0 1px #000}
.card::before{left:10px}.card::after{right:10px}
.kicker{font-family:var(--f-label);font-weight:600;text-transform:uppercase;letter-spacing:.2em;font-size:12px;color:var(--silk-dim);display:flex;justify-content:space-between;gap:8px;font-variant-numeric:tabular-nums}
.ctitle{font-family:var(--f-title);font-size:clamp(30px,9vw,42px);line-height:1;margin:0;color:var(--silk);text-wrap:balance;letter-spacing:-.01em}
.ctitle.small{font-size:clamp(24px,7vw,32px)}
.cbody{font-family:var(--f-voice);font-size:17px;line-height:1.5;margin:0;color:#d9d4c7}
.cbody p{margin:0 0 .7em}.cbody p:last-child{margin:0}
.cbody em{color:var(--silk)}
.cbody .q{font-family:var(--f-label);font-style:normal;color:var(--cold);letter-spacing:.02em}
.specs{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-family:var(--f-label);font-size:13px;text-transform:uppercase;letter-spacing:.1em;color:var(--silk-dim);border-top:1px solid #2c3033;padding-top:12px;font-variant-numeric:tabular-nums}
.specs dd{margin:0;color:var(--silk)}
.jackrow{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:4px}
.hint{font-family:var(--f-label);font-size:12px;letter-spacing:.08em;color:var(--silk-dim);text-transform:uppercase;flex:1 1 140px}
.jack{appearance:none;border:0;background:none;color:var(--silk);cursor:pointer;display:flex;align-items:center;gap:10px;font-family:var(--f-label);font-weight:700;letter-spacing:.18em;text-transform:uppercase;font-size:15px;padding:4px}
.jack i{width:30px;height:30px;border-radius:50%;background:radial-gradient(circle,#050505 0 34%,#c9c9c4 36% 52%,#6d6f70 54% 66%,#2a2c2d 68%);box-shadow:0 0 0 1px #000;position:relative;transition:box-shadow .2s}
.jack:hover i{box-shadow:0 0 0 1px #000,0 0 14px var(--amber)}
.led{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--amber);box-shadow:0 0 8px var(--amber);margin-right:6px;vertical-align:1px}

.dial{display:grid;gap:6px;border-top:1px solid #2c3033;padding-top:12px}
.dial-top{display:flex;justify-content:space-between;align-items:baseline;font-family:var(--f-label);text-transform:uppercase;letter-spacing:.12em;font-size:13px;font-weight:600;color:var(--silk-dim)}
.dial-top output{color:var(--amber);font-variant-numeric:tabular-nums;font-size:15px}
.dial-ends{display:flex;justify-content:space-between;font-family:var(--f-label);text-transform:uppercase;letter-spacing:.1em;font-size:11px;color:var(--silk-dim)}
#growth{-webkit-appearance:none;appearance:none;width:100%;height:28px;background:transparent;margin:0;cursor:pointer}
#growth::-webkit-slider-runnable-track{height:6px;background:#0b0c0d;border:1px solid #000;border-radius:3px;box-shadow:0 0 0 1px #2c3033}
#growth::-moz-range-track{height:6px;background:#0b0c0d;border:1px solid #000;border-radius:3px}
#growth::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:26px;margin-top:-11px;border-radius:2px;background:linear-gradient(#d9d6cf,#8f8d88);border:1px solid #000;box-shadow:inset 0 -2px 0 #6d6b66,0 2px 4px rgba(0,0,0,.5)}
#growth::-moz-range-thumb{width:16px;height:26px;border-radius:2px;background:linear-gradient(#d9d6cf,#8f8d88);border:1px solid #000}
#growth:focus-visible{outline:2px solid var(--amber);outline-offset:4px}
#mod.low b,#mod.low{color:#ff5a4a;animation:lowp .6s steps(2) infinite}
@keyframes lowp{50%{opacity:.45}}
.feed{color:#ff3d8b;font-weight:700}
#mod .rule{display:block;font-size:11px;letter-spacing:.06em;color:#9b998f;font-weight:600;margin-top:2px}
#mod .sw{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px;vertical-align:-1px}
@media (prefers-reduced-motion:reduce){#caption,#fill{transition:none}#mod.low,#mod.low b{animation:none}}
</style>
</head>
<body>

<canvas id="c" aria-label="Game view: a eurorack module panel"></canvas>

<div id="hud" hidden>
  <div id="mod"><b>VCO</b> · 10HP</div>
  <div id="meter"><div id="meterTxt">Ø <b>1.0</b> mm / 6.0 mm</div><div id="bar"><div id="fill"></div></div></div>
  <div id="right"><div id="tally">keepsakes <span id="tk">0</span><br>looked up <span id="tu">0</span></div><button id="mute" type="button">Sound</button></div>
</div>

<div id="caption" aria-live="polite"><div id="who">Otto</div><div id="line"></div></div>

<div id="veil"><div class="card" id="card"></div></div>
<script>
// ===== DATA: modules, levels, words =====
// World units are millimetres. 1 HP = 5.08 mm, 3U panel = 128.5 mm tall.
const HP = 5.08, U3 = 128.5;

// Panels. x/y are fractions of the panel; knob = [x,y,radius mm,label], jack = [x,y,label]. The last jack is the module's OUT.
const MODS = {
  VCO:{ name:'Origin', hp:10, field:'chain', rule:'Chain pickups quickly. Each one in a row is worth more, up to 2×.',
    knobs:[[.5,.17,6.2,'FREQ'],[.5,.42,4.2,'FINE'],[.28,.6,3.0,'PW'],[.72,.6,3.0,'FM']],
    jacks:[[.25,.76,'1V/OCT'],[.75,.76,'SYNC'],[.2,.89,'SAW'],[.5,.89,'SQR'],[.8,.89,'OUT']] },
  LFO:{ name:'Tide', hp:12, field:'tide', rule:'Roll with the current for 1.5× growth. Against it, only 0.6×.',
    knobs:[[.5,.2,7.0,'RATE'],[.3,.47,4.0,'SHAPE'],[.7,.47,4.0,'DEPTH']],
    jacks:[[.22,.72,'RESET'],[.5,.72,'CV'],[.78,.72,'TRI'],[.3,.88,'SQR'],[.7,.88,'OUT']] },
  SEQ:{ name:'Steps', hp:16, field:'steps', rule:'Each lit step sprays a part. Accent steps 4 and 8 kick hard and knock one off you.',
    knobs:[[.25,.2,4.2,'RATE'],[.75,.2,4.2,'LENGTH']],
    jacks:[[.2,.9,'CLK'],[.4,.9,'RESET'],[.6,.9,'GATE'],[.8,.9,'OUT']] },
  VCF:{ name:'Resonance', hp:16, field:'peaks', rule:'Only parts inside the passband color stick. The cutoff sweeps around the spectrum.',
    knobs:[[.5,.17,8.0,'CUTOFF'],[.22,.47,4.6,'RES'],[.78,.47,4.6,'ENV']],
    jacks:[[.2,.72,'IN'],[.4,.72,'CV'],[.6,.72,'FM'],[.8,.72,'Q'],[.3,.88,'LP'],[.7,.88,'OUT']] },
  ENV:{ name:'Contour', hp:12, field:'adsr', rule:'Attack is fast. Decay is sticky but worth 1.5×. Release is slippery and leaks 3× faster.',
    knobs:[[.25,.2,3.4,'A'],[.75,.2,3.4,'D'],[.25,.32,3.4,'S'],[.75,.32,3.4,'R']],
    jacks:[[.25,.91,'GATE'],[.75,.91,'OUT']] },
  VCA:{ name:'Attenuation', hp:20, field:'dark', rule:'Your light fades. Glowing parts recharge it.',
    knobs:[[.3,.2,6.5,'GAIN'],[.7,.2,6.5,'BIAS'],[.5,.46,5.0,'RESP']],
    jacks:[[.18,.7,'IN 1'],[.39,.7,'CV 1'],[.61,.7,'IN 2'],[.82,.7,'CV 2'],[.3,.87,'MIX'],[.7,.87,'OUT']] },
  DLY:{ name:'Echo', hp:14, field:'echo', rule:'Echoes only collect the same kind of part you picked up last.',
    knobs:[[.3,.2,5.0,'TIME'],[.7,.2,5.0,'FDBK'],[.5,.46,4.0,'MIX']],
    jacks:[[.2,.7,'IN'],[.4,.7,'CLK'],[.6,.7,'CV'],[.8,.7,'WET'],[.3,.87,'DRY'],[.7,.87,'OUT']] },
  OUT:{ name:'Release', hp:28, field:null,
    knobs:[[.24,.22,7.0,'LEVEL'],[.5,.22,7.0,'VERB'],[.76,.22,7.0,'TONE']],
    jacks:[[.15,.7,'L'],[.32,.7,'R'],[.5,.7,'AUX'],[.68,.7,'SEND'],[.85,.7,'RTN'],[.5,.87,'MAIN OUT']] },
};

const LEVELS = [
  { mods:['VCO'], start:0.5, goal:3.0, pulseEvery:8, bars:56, chasers:0, scrollers:2,
    mix:{dust:3,solder:3,screw:2,nut:2,cap:1,led:3,wave:3,spark:3,plug:1},
    memento:{t:'ring',name:"Ilse's ring",line:"Ilse's ring. She took it off to knead bread, and the bread outlived her."},
    intro:["Otto Brandt is eighty-four. He repaired synthesizers in Lindenau for fifty-one years. Nobody has been born in Lindenau for eleven.",
      "He fell asleep at the bench in front of the rack he built for Ilse in 1979. It has been silent since she died. Now he is small enough to walk inside it. That slow thump is his heart, or the rack's. He stopped being able to tell years ago.",
      "<em>Roll up what's loose. Grow. When you're big enough, find the OUT jack and patch in.</em>"],
    line0:"This oscillator used to hum like a refrigerator in love. Nine years of silence. Let's see what's lying around." },
  { mods:['LFO'], start:1.3, goal:5.5, pulseEvery:7, bars:44, chasers:1, scrollers:3,
    mix:{dust:2,solder:2,screw:2,nut:1,cap:2,res:2,led:3,wave:3,spark:3,plug:2,knobcap:1,heart:1},
    memento:{t:'glasses',name:'his reading glasses',line:"My reading glasses. I stopped reading when the books started reading back."},
    intro:["A low-frequency oscillator. It moves slower than you can hear, the way a tide moves. Everything in here drifts with it, you included.",
      "The first scrollers live here. They don't move much. They are mostly face, and the face is mostly lit from below.",
      "<em>Ride the current or fight it. Your choice, same as always.</em>"],
    line0:"Slow modulation. Ilse said I was a slow modulation. She meant it kindly. Mostly." },
  { mods:['SEQ'], start:2.2, goal:8, pulseEvery:6.5, bars:44, chasers:1, scrollers:4,
    mix:{screw:2,nut:2,cap:2,res:2,led:3,wave:2,spark:2,plug:2,seq:3,knobcap:2,heart:1},
    memento:{t:'ticket',name:'a ticket stub',line:"Kraftwerk, Düsseldorf, 1979. Ilse fell asleep in the second half. I fell in love twice that night."},
    intro:["A sequencer: eight steps played in a circle, forever, one per half-beat.",
      "The lit step shoves whatever stands on it toward the next one. Ride the carousel or get thrown off it.",
      "<em>Somewhere in here is a ticket stub from 1979.</em>"],
    line0:"Eight steps and back to the start. I had a routine like this. Coffee, bench, solder, bed." },
  { mods:['VCF'], start:3, goal:10, pulseEvery:6, bars:52, chasers:1, scrollers:5,
    mix:{screw:2,nut:2,cap:2,res:2,led:3,chip:2,knobcap:3,plug:2,wave:2,spark:2,scope:2,heart:2,badge:1},
    memento:{t:'photo',name:'a photograph',line:"Jonas, age six, in headphones bigger than his head. He listened to everything, then."},
    intro:["A filter decides what gets through. Turn the resonance up and it starts to ring on its own, singing at the one frequency it can't let go of.",
      "Those bright peaks are resonance. They throw you. They throw everything.",
      "<em>Somewhere in here is a photograph Otto would like back.</em>"],
    line0:"Every filter has a frequency it can't let go of. Mine is a boy with headphones." },
  { mods:['ENV'], start:3.4, goal:10.5, pulseEvery:6, bars:44, chasers:2, scrollers:5,
    mix:{screw:1,cap:2,res:2,led:3,chip:2,knobcap:3,plug:2,wave:3,spark:2,scope:1,heart:2,badge:1},
    memento:{t:'watch',name:"his father's watch",line:"My father's pocket watch. It still keeps time. Nothing else in the house does."},
    intro:["An envelope gives a sound its shape: attack, decay, sustain, release. Strike, fall, hold, fade.",
      "The floor is divided the same way. Attack is fast. Decay drags. Sustain holds steady. Release lets you slide.",
      "<em>His father's watch is in here. It still ticks.</em>"],
    line0:"Attack, decay, sustain, release. I'm somewhere around the release, if we're honest." },
  { mods:['VCA'], start:4, goal:13, pulseEvery:5, bars:46, chasers:3, scrollers:8,
    mix:{nut:1,cap:1,res:1,chip:2,knobcap:2,plug:2,scope:2,seq:2,spark:2,heart:3,badge:3,phone:2},
    memento:{t:'letter',name:'an unsent letter',line:"The letter I wrote Jonas in '49. Never sent it. I didn't have his handle."},
    intro:["A voltage-controlled amplifier only ever makes things quieter. Gain at zero is silence. This one has been at zero for a long time.",
      "It's dark in here. The only light is yours, the parts', and theirs.",
      "<em>More scrollers. More of what falls off them.</em>"],
    line0:"An amplifier that only subtracts. I know the feeling. Turn me up a little." },
  { mods:['DLY'], start:4.6, goal:14, pulseEvery:5, bars:46, chasers:3, scrollers:8,
    mix:{chip:2,knobcap:2,plug:2,scope:2,seq:2,cable:2,spark:3,wave:2,heart:3,badge:3,phone:2},
    memento:{t:'drawing',name:"Jonas's drawing",line:"Jonas drew the rack when he was five. He gave it a face. It was smiling."},
    intro:["A delay plays everything back a moment later, a little quieter. Then again, quieter still.",
      "In here your echoes follow you, and they pick things up too.",
      "<em>Look for a child's drawing.</em>"],
    line0:"Everything I've done comes back half a second late. At least it comes back." },
  { mods:['VCO','LFO','SEQ','VCF','ENV','VCA','DLY','OUT'], rack:true, start:7, goal:22, pulseEvery:4.5, bars:80, chasers:6, scrollers:18, wake:true,
    mix:{led:2,chip:1,knobcap:2,plug:2,scope:2,seq:2,cable:2,spark:3,wave:2,heart:3,badge:3,phone:3},
    memento:{t:'key',name:'the shop key',line:"The key to the shop. Nobody has knocked since the last repair."},
    intro:["Every module, side by side. 128 HP of the last working synthesizer in Lindenau, and every module still does what it did.",
      "Everyone is here now. Bump a scroller and their phone falls. Some of them look up. One of them is Jonas.",
      "<em>Roll the whole rack. Then let go at the MAIN OUT, all the way at the end.</em>"],
    line0:"The whole rack at once. Ilse, listen. It's nearly a song." },
];
const LAST = LEVELS.length-1;

const OTTO = {
  grow:["Dust, solder, a screw from 1983. Everything I dropped finds its way back eventually.",
    "Collecting things. At my age you're supposed to be giving them away.",
    "Bigger now. Still not big enough to matter to anybody with a screen.",
    "A man is just the sum of what sticks to him.",
    "Ilse would laugh. I'm a lint ball with opinions."],
  shed:["The voltage shakes me loose. Fine. I was never attached to most of it.",
    "Gravity used to be the only thing that pushed me around.",
    "There goes a piece of me. Somebody will post about it.",
    "Everything I build comes apart. That's what makes it worth soldering."],
  ready:["That's enough of me. Find the OUT jack.","Big enough. Patch me in before I lose my nerve."],
  talk:["They used to have children. Now they have followers. Same diaper changes, fewer hugs.",
    "When I was young we stared at the sky. Now the sky has a feed, and it's mostly ads.",
    "None of them have heard a sawtooth wave in person. I find that unbearable.",
    "I said good morning. It counted as a comment."],
};

const SCROLL = [
  "hold on i'm in a space rn","is this a bit? are you a bit?","an old man touched me. posting it",
  "i'd have kids but the discourse is exhausting","ratio","i don't really do physical",
  "real life has terrible latency","the algorithm says i'm happy","do you have a link for outside",
  "why are you round","touch grass? grass got deprecated","sorry, who's your provider",
  "can you not. i'm grieving a streamer","there's a reel about this exact feeling",
  "my companion app says you're a red flag","i've never heard a sound that wasn't recommended",
  "babies are so 2030","is the sun sponsored","brb, refreshing","i'm not lonely, i'm subscribed",
  "is that a beat? who's dropping","my heart rate app says that's not mine",
];
const WOKEN = ["...oh. it's loud in here.","what is that sound?","i forgot i had hands.","is it always this bright?",
  "wait. who made that?","my battery died. what do i do now","hey. hi. hello. is that how it goes?","it's warm.",
  "i can feel the kick in my chest","can it play that part again?"];
const JONAS = {woke:"Papa? ...you shrank.", otto:"No, Jonas. You grew. I just wasn't looking either."};

const SCALE = [0,3,5,7,10]; // A minor pentatonic
// what each patch adds to the rack's voice
const HEARD=["A sawtooth. Two of them, a quarter-hertz apart, beating against each other like an old couple sharing a bed.",
  "Now the pitch drifts. Slow, tidal. It sounds like breathing.",
  "Notes. An eight-step phrase going round and round, like a man pacing a kitchen.",
  "The filter opens and closes on its own. The tone has a mouth now.",
  "Every note has a shape: a strike, a fall, a held breath, a fade. A bass line follows the kick.",
  "The amplifier opens wide. Hi-hats, ticking like the clock in the hall.",
  "Every note comes back twice, softer each time, the way memories do.",
  ""];

// scrollers who chase you to film you
const CHASE=["omg wait. filming this","hold still old man","CONTENT","this is going viral","don't move, i'm live","chat, look at this guy"];
const FLATTENED=["ok ok ok","my phone!!","i was LIVE","that's assault, probably","deleting this"];
// digital debris: grows you twice as fast, then you leak faster for a while
const DIGITAL={heart:1,badge:1,phone:1};

// ===== ENDING =====
function endingLines(){
  const n=G.lookedUp, tot=LEVELS[LAST].scrollers, k=G.keepsakes, K=LEVELS.length;
  const crowd = n>=10 ? `${n} of them stayed to listen. Nobody filmed it. One asked what the piece was called, and Otto realised it had never had a name.`
    : n>=4 ? `${n} of them looked up. The rest posted that they had heard something. Otto decided that counted, a little.`
    : `Hardly anyone looked up at first. It didn't matter. The sound was already on its way out.`;
  const son = G.jonas ? `Jonas walks in beside him, phone in his pocket, and asks how the filter works. Otto starts at the beginning.`
    : `Somewhere among the trees is his son. Otto has time now. The rack will keep playing until he finds him.`;
  const keep = k===K ? `All eight keepsakes are in his coat pocket, rolled in with the screws and the dust, where they belong.`
    : `${k} of the eight keepsakes are in his coat pocket. The rest are still in the rack. Someone will find them.`;
  return [
    [0.5,"The patch holds. The whole rack plays at once, louder than it was ever allowed to."],
    [5.5,crowd],
    [11,"The sound goes out through the main outs, through the shop window, into the street."],
    [15,"Everywhere it reaches, the feeds stop scrolling."],
    [19,"Screens dim. Thumbs rest. People look at what's in front of them, which turns out to be each other."],
    [25,"By spring, the shop on Kirchgasse is a forest. Nobody can say how."],
    [31,son],

    for(const it of G.items){ const dxp=it.x-p.x; if(dxp>p.R||dxp<-p.R) continue; const d=Math.hypot(dxp,it.y-p.y); if(d>R0 && d<=p.R){ const k=(b.r*4+4)/(1+it.s); it.vx+=dxp/d*k; it.vy+=(it.y-p.y)/d*k; it.vr+=rand(-5,5);} }

    if(s.chaser && !s.woke){ s.stun-=dt; const dx=b.x-s.x, dy=b.y-s.y, d=Math.hypot(dx,dy)||1, term=acc/2.1;

    if(d<m && d>0){ const nx=dx/d, ny=dy/d, over=m-d; s.x+=nx*over*.5; s.y+=ny*over*.5; b.x-=nx*over*.5; b.y-=ny*over*.5;
      const vn=b.vx*nx+b.vy*ny, rel=vn-(s.vx*nx+s.vy*ny), term=acc/2.1;

function bumpScroller(s,nx,ny){

    if(s.jonas){ G.jonas=true; s.say=JONAS.woke; s.sayT=4; say('Jonas',JONAS.woke,true,3.6); setTimeout(()=>say('Otto',JONAS.otto,false,6),3700); }
    else { const l=pick(WOKEN); s.say=l; s.sayT=3.5; say('Scroller',l,true,3.5); }

// one random surface part drifts off (not always the newest, so it reads as wear, not punishment)
function leakOne(){ const b=G.ball, cand=[]; for(let i=Math.max(0,G.att.length-60);i<G.att.length;i++){ const a=G.att[i]; if(a.d>=b.r*.7&&!a.mem) cand.push(i); }
  if(!cand.length) return; const i=pick(cand), a=G.att[i]; G.att.splice(i,1); G.mass=Math.max(0,G.mass-a.s*a.s*(a.w||1));
  const ang=a.ang+b.spin, ox=Math.cos(ang), oy=Math.sin(ang);
  G.items.push({t:a.t,s:a.s,col:a.col,seed:a.seed,rot:a.rot+b.spin,x:b.x+ox*(b.r+a.s+.2),y:b.y+oy*(b.r+a.s+.2),vx:b.vx+ox*b.r*1.5,vy:b.vy+oy*b.r*1.5,vr:rand(-4,4),cool:1.5});

// ----- module rules -----
function tideMult(){ const b=G.ball; if(panelAt(b.x).field!=='tide') return 1; const [fx,fy]=fieldAt(b.x,b.y,G.t), v=Math.hypot(b.vx,b.vy), F=Math.hypot(fx,fy);
  if(v<b.r*.6||!F) return 1; const c=(b.vx*fx+b.vy*fy)/(v*F); return c>.35?1.5:c<-.35?.6:1; }
function pickMult(){ const b=G.ball, f=panelAt(b.x).field; let m=1;
  if(f==='chain' && G.t-G.lastPickT<1) m=1+.2*Math.min(5,G.chain+1);
  m*=tideMult(); if(f==='adsr' && adsrBand(b.x,b.y)===1) m*=1.5; return m; }
function passHue(){ return (G.t*14)%360; }
function hueOf(hex){ const r=parseInt(hex.slice(1,3),16)/255, g=parseInt(hex.slice(3,5),16)/255, bl=parseInt(hex.slice(5,7),16)/255, mx=Math.max(r,g,bl), mn=Math.min(r,g,bl), d=mx-mn;
  if(!d) return 0; const h= mx===r?((g-bl)/d)%6 : mx===g?(bl-r)/d+2 : (r-g)/d+4; return (h*60+360)%360; }
function inBand(it){ if(it.hue==null) it.hue=hueOf(it.col||'#888888'); let d=Math.abs(it.hue-passHue())%360; if(d>180) d=360-d; return d<=75; }

// brushed aluminium, screen-space
const brush=(()=>{ const c=document.createElement('canvas'); c.width=c.height=256; const g=c.getContext('2d');
  g.fillStyle='#17191a'; g.fillRect(0,0,256,256);
  for(let i=0;i<900;i++){ g.strokeStyle=`rgba(${Math.random()<.5?255:0},${Math.random()<.5?255:0},255,${Math.random()*.025})`; const y=Math.random()*256;
    g.beginPath(); g.moveTo(Math.random()*256-60,y); g.lineTo(Math.random()*256+60,y+Math.random()*.6); g.stroke(); }

const CAM={x:0,y:0,z:20};
const SX=x=>(x-CAM.x)*CAM.z+VW/2, SY=y=>(y-CAM.y)*CAM.z+VH/2;
function camUpdate(dt,snap){ const b=G.ball, zt=Math.max(Math.min(VW,VH)*.052/b.r, Math.min(VH/(G.H+24), VW*.28/b.r)); // big ball: let the panel fill the height
  CAM.z = snap?zt:CAM.z+(zt-CAM.z)*Math.min(1,dt*2.2);
  const hw=VW/2/CAM.z, hh=VH/2/CAM.z; let x=b.x, y=b.y;
  x = 2*hw>=G.W ? G.W/2 : clamp(x,hw,G.W-hw); y = 2*hh>=G.H+20 ? G.H/2 : clamp(y,hh-12,G.H-hh+6);

function silk(txt,x,y,mm,font='Barlow Condensed',w=600,al='center',col='#ebe6d9'){
  const px=mm*CAM.z; if(px<5) return; cx.font=`${w} ${px}px "${font}", sans-serif`; cx.fillStyle=col; cx.textAlign=al; cx.textBaseline='middle';
  if(font==='Barlow Condensed'){ cx.letterSpacing=(px*.08)+'px'; } cx.fillText(txt,SX(x),SY(y)); cx.letterSpacing='0px'; }

function render(){
  const z=CAM.z, b=G.ball, L=G.L, W=G.W, H=G.H, t=G.t;
  cx.setTransform(DPR,0,0,DPR,0,0);
  cx.fillStyle='#08090a'; cx.fillRect(0,0,VW,VH);
  // rack rails above/below
  cx.fillStyle='#2a2d2f'; const ry1=SY(0), ry2=SY(H);
  cx.fillRect(0,ry1-9*z,VW,9*z); cx.fillRect(0,ry2,VW,9*z);
  cx.fillStyle='#1b1d1e'; const k0=Math.floor((CAM.x-VW/2/z)/HP)-1, k1=Math.ceil((CAM.x+VW/2/z)/HP)+1;

    cx.strokeStyle='#000'; cx.lineWidth=Math.max(1,.3*z); cx.strokeRect(px,SY(0),pw,H*z);
    for(const [hx,hy] of [[7.5,3],[p.w-7.5,3],[7.5,H-3],[p.w-7.5,H-3]]) screw(SX(p.x0+hx),SY(hy),1.6*z);
    silk(p.id,mx,10,7,'Major Mono Display',400); silk(m.name.toUpperCase(),mx,16.5,2.4,'Barlow Condensed',600,'center','#9b998f');
    silk(`BRANDT ELEKTRONIK · ${m.hp}HP`,mx,H-9,1.7,'Barlow Condensed',600,'center','#7c7a72');
    if(p.field==='tide'){ cx.strokeStyle='rgba(127,211,255,.14)'; cx.lineWidth=Math.max(1,.25*z); cx.beginPath();

        const ph=((t*.8+x*.13+y*.07)%1); cx.moveTo(SX(x+a/mm*l*ph),SY(y+c/mm*l*ph)); cx.lineTo(SX(x+a/mm*l*(ph+.5)),SY(y+c/mm*l*(ph+.5))); } cx.stroke(); }

}

function drawScroller(s){ const z=CAM.z, x=SX(s.x), y=SY(s.y), h=s.h*z; if(x<-h||x>VW+h||y<-h*1.5||y>VH+h) return;

function drawBall(){ const b=G.ball, z=CAM.z, x=SX(b.x), y=SY(b.y), r=b.r*z;

function drawFog(){ fx.setTransform(DPR,0,0,DPR,0,0); fx.globalCompositeOperation='source-over'; fx.clearRect(0,0,VW,VH);
  fx.fillStyle=`rgba(4,5,6,${.94*G.darkA})`; fx.fillRect(0,0,VW,VH); fx.globalCompositeOperation='destination-out';
  const hole=(x,y,r,a)=>{ const g=fx.createRadialGradient(x,y,0,x,y,r); g.addColorStop(0,`rgba(0,0,0,${a})`); g.addColorStop(1,'rgba(0,0,0,0)'); fx.fillStyle=g; fx.beginPath(); fx.arc(x,y,r,0,7); fx.fill(); };
  const b=G.ball, z=CAM.z; hole(SX(b.x),SY(b.y),b.r*z*(2.2+4.6*G.light+.3*Math.sin(G.t*7)),1);
  for(const s of G.scrollers) hole(SX(s.x),SY(s.y-s.h*.6),s.h*z*.6,.8);
  let lit=0; for(const it of G.items){ if(!GLOWS[it.t]) continue; const x=SX(it.x), y=SY(it.y); if(x<-20||x>VW+20||y<-20||y>VH+20) continue; hole(x,y,Math.max(8,it.s*z*3.2),.6); if(++lit>140) break; }
  for(const p of G.pulses) hole(SX(p.x),SY(p.y),p.R*z,.25);
  if(G.ready){ const o=G.jacks.find(j=>j.out); hole(SX(o.x),SY(o.y),o.r*z*6,.9); }
  for(const j of G.jacks) if(j.blink) hole(SX(j.x),SY(j.y),j.r*z*3,.7);
  cx.setTransform(1,0,0,1,0,0); cx.drawImage(fog,0,0); cx.setTransform(DPR,0,0,DPR,0,0); }

function edgeArrow(o){ const x=SX(o.x), y=SY(o.y), m=46; if(x>m&&x<VW-m&&y>m+40&&y<VH-m) return;
  const ax=clamp(x,m,VW-m), ay=clamp(y,m+50,VH-m-60), a=Math.atan2(y-ay,x-ax);

  cx.beginPath(); cx.moveTo(16,0); cx.lineTo(-8,-10); cx.lineTo(-3,0); cx.lineTo(-8,10); cx.fill(); cx.restore(); }

function rr(x,y,w,h,r){ cx.beginPath(); cx.moveTo(x+r,y); cx.arcTo(x+w,y,x+w,y+h,r); cx.arcTo(x+w,y+h,x,y+h,r); cx.arcTo(x,y+h,x,y,r); cx.arcTo(x,y,x+w,y,r); cx.closePath(); }

// sequencer pads: eight steps in a ring, lit on the 8th notes
function drawPads(){ if(!G.pads.length) return; const z=CAM.z, st=activeStep();

    cx.fillStyle=on?col:'#24282b'; rr(x-r,y-r,r*2,r*2,r*.3); cx.fill(); cx.strokeStyle=on?'#fff':col; cx.globalAlpha=on?1:.5; cx.lineWidth=Math.max(1,.3*z); cx.stroke(); cx.globalAlpha=1;

    cx.save(); cx.translate(x,y); cx.rotate(a); cx.fillStyle=on?'#111':col; cx.globalAlpha=on?.8:.35;

// envelope floor: four bands and the curve they make
const ADSR_COL=['#ff3d8b','#ffb547','#33e1ff','#9b6bff'], ADSR_NAME=['ATTACK','DECAY','SUSTAIN','RELEASE'];
function drawADSR(p){ const z=CAM.z, H=G.H, x=SX(p.x0+3), w=(p.w-6)*z;
  for(let i=0;i<4;i++){ const y=SY(H*(ADSR_TOP+ADSR_H*i)), h=H*ADSR_H*z; cx.fillStyle=ADSR_COL[i]; cx.globalAlpha=.13; cx.fillRect(x,y,w,h); cx.globalAlpha=1;
    cx.strokeStyle=ADSR_COL[i]; cx.globalAlpha=.4; cx.lineWidth=1; cx.strokeRect(x,y,w,h); cx.globalAlpha=1;
    silk(ADSR_NAME[i],p.x0+p.w/2,H*(ADSR_TOP+ADSR_H*i+ADSR_H/2),2.6,'Barlow Condensed',700,'center',ADSR_COL[i]);

  cx.moveTo(X(0),SY(bot)); cx.lineTo(X(.15),SY(top)); cx.lineTo(X(.35),SY(top+(bot-top)*.4)); cx.lineTo(X(.7),SY(top+(bot-top)*.4)); cx.lineTo(X(1),SY(bot)); cx.stroke(); }

// delay echoes: ghosts of you, a moment behind
function drawEchoes(){ const z=CAM.z; for(const e of G.echoes){ const x=SX(e.x), y=SY(e.y), r=e.r*z;
  cx.save(); cx.globalAlpha=.35*e.a; cx.translate(x,y); glow('#33e1ff',r*1.6,.5); cx.restore();
  cx.save(); cx.globalAlpha=.4*e.a; cx.strokeStyle='#33e1ff'; cx.lineWidth=Math.max(1.5,r*.08); cx.setLineDash([r*.3,r*.2]);
  cx.beginPath(); cx.arc(x,y,r,G.t*2,G.t*2+6.283); cx.stroke(); cx.setLineDash([]); cx.restore(); } }

// filter passband: a spectrum strip with the window that currently lets parts stick
function drawPassband(p){ const z=CAM.z, PY=G.H*.6, y=SY(PY), x0=SX(p.x0+p.w*.12), w=p.w*.76*z, h=Math.max(3,1.6*z);

  const c=passHue(), u=c/360, bw=150/360; cx.strokeStyle='#fff'; cx.lineWidth=Math.max(1,.3*z);
  for(const off of [0,-1,1]){ const a=x0+w*(u-bw/2+off), bb=x0+w*(u+bw/2+off); const L=Math.max(a,x0), R=Math.min(bb,x0+w); if(R<=L) continue;
    cx.fillStyle=`hsl(${c},100%,60%)`; cx.globalAlpha=.9; cx.fillRect(L,y,R-L,h); cx.globalAlpha=1; cx.strokeRect(L,y-1,R-L,h+2); }

// ===== LIVE PARTS: colour, glow, motion =====
const NEON=['#ff3d8b','#33e1ff','#b6ff3b','#ff8a1f','#9b6bff','#ffe14d','#ff4b3a','#3dff9a'];
const ANOD=['#e0457b','#3fa9f5','#f5a623','#7ed321','#9b59ff','#e8e4da','#1fd1b9'];
// which parts carry their own light, and which breathe
const GLOWS={led:1,spark:1,wave:1,scope:1,seq:1,phone:1,heart:1,badge:1,plug:1,cable:1,knobcap:1,chip:1};
const BREATHE={led:.08,spark:.18,wave:.06,heart:.14,badge:.07,knobcap:.04,plug:.05,cable:.05,scope:.03,seq:.03,phone:.03,ring:.06,glasses:.04,photo:.04,letter:.04,key:.05,ticket:.04,watch:.04,drawing:.04};

// pre-rendered glow sprites, drawn additively (much cheaper than shadowBlur)
const SPR={};
function sprite(col){ if(SPR[col]) return SPR[col]; const c=document.createElement('canvas'); c.width=c.height=64; const g=c.getContext('2d');
  const rg=g.createRadialGradient(32,32,0,32,32,32); rg.addColorStop(0,col); rg.addColorStop(.25,col+'aa'); rg.addColorStop(1,col+'00'); g.fillStyle=rg; g.fillRect(0,0,64,64); return SPR[col]=c; }
function glow(col,r,a=1){ const c=cx, op=c.globalCompositeOperation, ga=c.globalAlpha; c.globalCompositeOperation='lighter'; c.globalAlpha=ga*a; c.drawImage(sprite(col),-r,-r,r*2,r*2); c.globalAlpha=ga; c.globalCompositeOperation=op; }

function colourFor(t){
  if(t==='screw'||t==='nut') return pick(ANOD);
  if(t==='dust'||t==='solder'||t==='res'||t==='cap') return pick(NEON);
  return pick(NEON);
}
// waveform shapes for stray signals and scopes, phase in cycles
const WAVES=[p=>Math.sin(p*6.283), p=>1-4*Math.abs(((p+.25)%1+1)%1-.5), p=>2*(((p%1)+1)%1)-1, p=>(((p%1)+1)%1)<.5?1:-1];

function drawItem(it,s){ const c=cx, T=G.t, ph=it.seed*6.283, rate=.7+it.seed*1.6, col=it.col||'#ffb547';
  const br=BREATHE[it.t]; let k=1+.12*G.kickV; if(br) k*=1+br*Math.sin(T*rate*3+ph); c.scale(k,k); // everything jumps a little on the kick
  switch(it.t){
  case 'dust': c.fillStyle='#86827a'; c.beginPath(); c.arc(0,0,s*.7,0,7); c.arc(s*.4,s*.2,s*.5,0,7); c.arc(-s*.3,s*.35,s*.45,0,7); c.fill();

  case 'solder': { const g=c.createRadialGradient(-s*.3,-s*.3,0,0,0,s); g.addColorStop(0,'#ffffff'); g.addColorStop(.5,'#c9ccce'); g.addColorStop(1,'#6d7072');
    c.fillStyle=g; c.beginPath(); c.ellipse(0,0,s,s*.8,0,0,7); c.fill();
    const sh=Math.sin(T*rate*1.5+ph); c.fillStyle=col; c.globalAlpha=.35+.35*sh; c.beginPath(); c.ellipse(s*.25*sh,-s*.2,s*.3,s*.15,.6,0,7); c.fill(); c.globalAlpha=1; break; }

  case 'res': c.strokeStyle='#d8d8d2'; c.lineWidth=Math.max(1,s*.12); c.beginPath(); c.moveTo(-s,0); c.lineTo(s,0); c.stroke();
    c.fillStyle='#6fb6ff'; c.fillRect(-s*.55,-s*.28,s*1.1,s*.56);
    [col,'#111','#ff4b3a','#ffe14d'].forEach((k,i)=>{ c.fillStyle=k; c.fillRect(-s*.4+i*s*.24,-s*.28,s*.1,s*.56); }); break;
  case 'led': { const on=Math.sin(T*rate*4+ph)>-.25; if(on) glow(col,s*2.6,.9);
    c.fillStyle=on?col:'#2a2a2a'; c.beginPath(); c.arc(0,0,s*.75,0,7); c.fill(); c.strokeStyle='rgba(255,255,255,.35)'; c.lineWidth=Math.max(1,s*.1); c.stroke();
    c.fillStyle='rgba(255,255,255,.75)'; c.beginPath(); c.arc(-s*.22,-s*.25,s*.2,0,7); c.fill(); break; }
  case 'spark': { glow(col,s*2.8,.95); const n=5; c.strokeStyle='#fff'; c.lineWidth=Math.max(1,s*.14); c.beginPath();

  case 'wave': { const f=WAVES[(it.seed*4)|0], p0=T*rate*.8+ph; glow(col,s*1.8,.45);
    c.strokeStyle=col; c.lineWidth=Math.max(1.2,s*.2); c.lineCap='round'; c.lineJoin='round'; c.beginPath();
    for(let i=0;i<=24;i++){ const u=i/24, x=-s+u*2*s, y=-f(p0+u*1.5)*s*.45; i?c.lineTo(x,y):c.moveTo(x,y); } c.stroke(); break; }
  case 'scope': { c.fillStyle='#1d2124'; rr(-s,-s*.75,s*2,s*1.5,s*.18); c.fill(); c.fillStyle='#04120c'; rr(-s*.82,-s*.58,s*1.64,s*1.16,s*.1); c.fill();
    c.strokeStyle='rgba(120,255,190,.15)'; c.lineWidth=1; c.beginPath(); c.moveTo(-s*.82,0); c.lineTo(s*.82,0); c.moveTo(0,-s*.58); c.lineTo(0,s*.58); c.stroke();
    const f=WAVES[(it.seed*4)|0], p0=T*rate*1.2; c.save(); glow(col,s*1.2,.35); c.strokeStyle=col; c.lineWidth=Math.max(1,s*.12); c.beginPath();
    for(let i=0;i<=28;i++){ const u=i/28, x=-s*.78+u*s*1.56, y=-f(p0+u*2)*s*.4; i?c.lineTo(x,y):c.moveTo(x,y); } c.stroke(); c.restore(); break; }
  case 'seq': { c.fillStyle='#202428'; rr(-s,-s*.42,s*2,s*.84,s*.15); c.fill(); const step=Math.floor(T*rate*4+it.seed*8)%4;
    for(let i=0;i<4;i++){ const x=-s*.72+i*s*.48; if(i===step){ c.save(); c.translate(x,0); glow(col,s*.7,1); c.restore(); }
      c.fillStyle=i===step?'#fff':col+'55'; c.beginPath(); c.arc(x,0,s*.15,0,7); c.fill(); } break; }
  case 'plug': { const w=Math.sin(T*rate*2+ph)*.5; c.strokeStyle=col; c.lineWidth=Math.max(1.2,s*.26); c.lineCap='round';
    c.beginPath(); c.moveTo(s*.3,0); c.quadraticCurveTo(s*.75,w*s,s*1.1,w*s*.4); c.stroke();
    c.fillStyle=col; rr(-s*.55,-s*.28,s*.9,s*.56,s*.12); c.fill(); c.fillStyle='rgba(255,255,255,.3)'; c.fillRect(-s*.5,-s*.24,s*.8,s*.12);
    c.fillStyle='#dcdcd6'; c.fillRect(-s,-s*.09,s*.47,s*.18); glow(col,s*.6,.6*(.5+.5*Math.sin(T*rate*5+ph))); break; }
  case 'chip': c.fillStyle='#d0d0ca'; for(let i=-3;i<=3;i+=2){ c.fillRect(i*s*.17-s*.05,-s*.85,s*.1,s*1.7); } c.fillStyle='#14161a'; c.fillRect(-s*.75,-s*.6,s*1.5,s*1.2);

    if(i%3===0){ cx.save(); cx.translate(x+sw*1.5,VH*.86-h); glow(NEON[i%8],5+4*k,ga*.8); cx.restore(); } }

  for(const w of END.walkers){ w.x+=w.sp/60; if(w.x>1.1) w.x=-.15; const x=w.x*VW, y=VH*w.y, h=VH*w.h, bob=Math.sin(t*4+w.ph)*h*.03;
    cx.fillStyle='#0c0a1c'; cx.beginPath(); cx.ellipse(x,y-h*.35+bob,h*.12,h*.33,0,0,7); cx.fill(); cx.beginPath(); cx.arc(x,y-h*.8+bob,h*.1,0,7); cx.fill();
    cx.fillStyle='#ffb547'; cx.beginPath(); cx.arc(x+h*.04,y-h*.82+bob,Math.max(1,h*.02),0,7); cx.fill(); }
  // Otto, sitting by the rack at the edge of the clearing
  const ox=VW*.16, oy=VH*.88, oh=VH*.11; cx.fillStyle='#17191a'; cx.fillRect(ox+oh*.35,oy-oh*.45,oh*.9,oh*.45); cx.strokeStyle='#000'; cx.strokeRect(ox+oh*.35,oy-oh*.45,oh*.9,oh*.45);
  for(let i=0;i<6;i++){ const lx=ox+oh*(.45+i*.14), ly=oy-oh*.3, on=Math.sin(t*5+i)>0||k>.5; if(on){ cx.save(); cx.translate(lx,ly); glow(NEON[i],oh*.08*(1+k),ga); cx.restore(); } }
  cx.fillStyle='#0c0a1c'; cx.beginPath(); cx.ellipse(ox,oy-oh*.3,oh*.16,oh*.28,-.15,0,7); cx.fill(); cx.beginPath(); cx.arc(ox+oh*.05,oy-oh*.68,oh*.11,0,7); cx.fill();
  cx.fillStyle='#ffb547'; cx.beginPath(); cx.arc(ox+oh*.1,oy-oh*.7,Math.max(1,oh*.02),0,7); cx.fill();
  // fireflies on the beat
  cx.save(); cx.globalCompositeOperation='lighter'; for(const f of END.flies){ const x=((f.x+Math.sin(t*f.sp+f.ph)*.03)%1)*VW, y=(f.y+Math.cos(t*f.sp*1.3+f.ph)*.02)*VH;
    const a=ga*(.4+.6*Math.max(0,Math.sin(t*2*f.sp+f.ph)))*(.7+.6*k); cx.save(); cx.translate(x,y); glow(f.col,f.r*4,a); cx.restore(); } cx.restore();
  if(t<26) endParts(1/60);
}
// captions: one line at a time, Otto's register
function endCaptions(t){ if(t>END.creditsAt-1) return; const L=END.lines; let cur=-1; for(let i=0;i<L.length;i++) if(t>=L[i][0]) cur=i; if(cur<0) return;
  const t0=L[cur][0], t1=cur+1<L.length?L[cur+1][0]:END.creditsAt-1, a=clamp(Math.min((t-t0)/.8,(t1-t)/.8),0,1);
  const fs=clamp(VW*.05,18,26), maxW=Math.min(VW-48,560); cx.font=`italic 300 ${fs}px "Spectral",Georgia,serif`; const lines=wrapText(L[cur][1],maxW);
  const lh=fs*1.38, h=lines.length*lh, y0=VH*.72-h/2; cx.globalAlpha=a*.6; cx.fillStyle='#05040c'; rr(VW/2-maxW/2-14,y0-12,maxW+28,h+24,4); cx.fill();
  cx.globalAlpha=a; cx.fillStyle='#f3ecdc'; cx.textAlign='center'; cx.textBaseline='top'; lines.forEach((ln,i)=>cx.fillText(ln,VW/2,y0+i*lh)); cx.globalAlpha=1; }
function wrapText(txt,maxW){ const out=[]; let line=''; for(const w of txt.split(' ')){ const test=line?line+' '+w:w; if(cx.measureText(test).width>maxW&&line){ out.push(line); line=w; } else line=test; } if(line) out.push(line); return out; }
// credits roll up through the forest
function endCredits(u){ cx.fillStyle=`rgba(4,3,10,${Math.min(.5,u*.2)})`; cx.fillRect(0,0,VW,VH);
  const sizes={t:[34,'400',"Major Mono Display",'#f3ecdc'],h:[12,'600',"Barlow Condensed",'#b8b2a4'],n:[22,'400',"Spectral",'#f3ecdc'],p:[17,'italic 300',"Spectral",'#e6dfcf'],g:[0]};
  let y=VH+20-u*34, last=y; cx.textAlign='center'; cx.textBaseline='top';
  for(const [ty,txt] of CREDITS){ const [fs,w,f,c]=sizes[ty]; if(ty==='g'){ y+=30; continue; }
    if(y>-40&&y<VH+40){ cx.font=`${w} ${fs}px "${f}",serif`; cx.fillStyle=c; if(ty==='h'){ cx.letterSpacing='2.5px'; cx.fillText(txt.toUpperCase(),VW/2,y); cx.letterSpacing='0px'; } else cx.fillText(txt,VW/2,y); }
    y+=fs*(ty==='h'?1.7:1.5)+(ty==='t'?14:ty==='n'?10:0); last=y; }
  if(last<VH*.35) finishEnding(); }
