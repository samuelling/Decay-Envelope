<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#141617">
<title>Decay Envelope</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Major+Mono+Display&family=Spectral:ital,wght@0,400;1,300;1,400&display=swap">
<style>
/* Layout: one full-bleed canvas (the module panel is the world); HUD as a silkscreened rail on top; story cards are little faceplates screwed over the screen. Single dark look, by design. */
:root{
  --panel:#141617;      /* black anodized aluminium */
  --panel-2:#1d2022;
  --rail:#2a2d2f;
  --silk:#ebe6d9;       /* silkscreen ink */
  --silk-dim:#9b998f;
  --amber:#ffb547;      /* Otto's warm LED */
  --cold:#7fd3ff;       /* the scrollers' screen glow */
  --red:#d94a3a;        /* patch cable */
  --f-title:"Major Mono Display", ui-monospace, monospace;
  --f-label:"Barlow Condensed", "Arial Narrow", system-ui, sans-serif;
  --f-voice:"Spectral", Georgia, "Times New Roman", serif;
  color-scheme:dark;
}
html,body{height:100%;margin:0;background:var(--panel);color:var(--silk);overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;background:var(--panel)}

#hud{position:fixed;left:0;right:0;top:0;padding:calc(env(safe-area-inset-top,0px) + 8px) 16px 8px;display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;
  background:linear-gradient(var(--rail),rgba(42,45,47,.86));border-bottom:1px solid #000;font-family:var(--f-label);text-transform:uppercase;letter-spacing:.08em;font-size:13px;font-weight:600;pointer-events:none}
#hud[hidden]{display:none!important}
#mod{white-space:nowrap}
#mod b{color:var(--amber);font-weight:700}
#meter{min-width:0;display:grid;gap:3px}
#meterTxt{font-variant-numeric:tabular-nums;color:var(--silk-dim);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#meterTxt b{color:var(--silk)}
#bar{height:6px;background:#0b0c0d;border:1px solid #000;border-radius:3px;overflow:hidden}
#fill{height:100%;width:0;background:var(--amber);box-shadow:0 0 8px var(--amber);transition:width .15s}
#fill.ready{background:var(--red);box-shadow:0 0 10px var(--red)}
#right{display:flex;gap:10px;align-items:center;pointer-events:auto}
#tally{font-variant-numeric:tabular-nums;color:var(--silk-dim);font-size:12px;text-align:right;line-height:1.15}
#tally span{color:var(--silk)}
#mute{appearance:none;border:1px solid var(--silk-dim);background:transparent;color:var(--silk);font:inherit;font-size:11px;letter-spacing:.1em;padding:4px 7px;border-radius:3px;cursor:pointer}
#mute:focus-visible,.jack:focus-visible{outline:2px solid var(--amber);outline-offset:3px}

#caption{position:fixed;left:16px;right:16px;bottom:calc(env(safe-area-inset-bottom,0px) + 18px);max-width:560px;margin:0 auto;padding:12px 16px 13px;
  background:rgba(12,13,14,.88);border:1px solid #33373a;border-left:3px solid var(--amber);border-radius:2px;pointer-events:none;
  opacity:0;transform:translateY(8px);transition:opacity .35s,transform .35s}
#caption.on{opacity:1;transform:none}
#caption.cold{border-left-color:var(--cold)}
#who{font-family:var(--f-label);font-weight:700;text-transform:uppercase;letter-spacing:.14em;font-size:11px;color:var(--amber);margin-bottom:3px}
#caption.cold #who{color:var(--cold)}
#line{font-family:var(--f-voice);font-style:italic;font-weight:300;font-size:17px;line-height:1.38}
#caption.cold #line{font-style:normal;font-family:var(--f-label);font-weight:500;font-size:16px;letter-spacing:.02em}

#veil{position:fixed;inset:0;display:grid;place-items:center;padding:16px;background:rgba(8,9,10,.72);overflow:auto}
#veil[hidden]{display:none!important}
.card{position:relative;width:100%;max-width:400px;background:linear-gradient(160deg,var(--panel-2),var(--panel));border:1px solid #000;border-radius:3px;
  box-shadow:0 0 0 1px #2c3033 inset,0 30px 60px rgba(0,0,0,.6);padding:34px 26px 26px;display:grid;gap:14px}
.card::before,.card::after{content:"";position:absolute;top:10px;width:9px;height:9px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#8d9093,#3b3e40 70%);box-shadow:0 0 0 1px #000}
.card::before{left:10px}.card::after{right:10px}
.kicker{font-family:var(--f-label);font-weight:600;text-transform:uppercase;letter-spacing:.2em;font-size:12px;color:var(--silk-dim);display:flex;justify-content:space-between;gap:8px;font-variant-numeric:tabular-nums}
.ctitle{font-family:var(--f-title);font-size:clamp(30px,9vw,42px);line-height:1;margin:0;color:var(--silk);text-wrap:balance;letter-spacing:-.01em}
.ctitle.small{font-size:clamp(24px,7vw,32px)}
.cbody{font-family:var(--f-voice);font-size:17px;line-height:1.5;margin:0;color:#d9d4c7}
.cbody p{margin:0 0 .7em}.cbody p:last-child{margin:0}
.cbody em{color:var(--silk)}
.cbody .q{font-family:var(--f-label);font-style:normal;color:var(--cold);letter-spacing:.02em}
.specs{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-family:var(--f-label);font-size:13px;text-transform:uppercase;letter-spacing:.1em;color:var(--silk-dim);border-top:1px solid #2c3033;padding-top:12px;font-variant-numeric:tabular-nums}
.specs dd{margin:0;color:var(--silk)}
.jackrow{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:4px}
.hint{font-family:var(--f-label);font-size:12px;letter-spacing:.08em;color:var(--silk-dim);text-transform:uppercase;flex:1 1 140px}
.jack{appearance:none;border:0;background:none;color:var(--silk);cursor:pointer;display:flex;align-items:center;gap:10px;font-family:var(--f-label);font-weight:700;letter-spacing:.18em;text-transform:uppercase;font-size:15px;padding:4px}
.jack i{width:30px;height:30px;border-radius:50%;background:radial-gradient(circle,#050505 0 34%,#c9c9c4 36% 52%,#6d6f70 54% 66%,#2a2c2d 68%);box-shadow:0 0 0 1px #000;position:relative;transition:box-shadow .2s}
.jack:hover i{box-shadow:0 0 0 1px #000,0 0 14px var(--amber)}
.led{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--amber);box-shadow:0 0 8px var(--amber);margin-right:6px;vertical-align:1px}
@media (prefers-reduced-motion:reduce){#caption,#fill{transition:none}}
</style>
</head>
<body>

<canvas id="c" aria-label="Game view: a eurorack module panel"></canvas>

<div id="hud" hidden>
  <div id="mod"><b>VCO</b> · 10HP</div>
  <div id="meter"><div id="meterTxt">Ø <b>1.0</b> mm / 6.0 mm</div><div id="bar"><div id="fill"></div></div></div>
  <div id="right"><div id="tally">keepsakes <span id="tk">0</span><br>looked up <span id="tu">0</span></div><button id="mute" type="button">Sound</button></div>
</div>

<div id="caption" aria-live="polite"><div id="who">Otto</div><div id="line"></div></div>

<div id="veil"><div class="card" id="card"></div></div>
<script>
// ===== DATA: modules, words =====
// World units are millimetres. 1 HP = 5.08 mm, 3U panel = 128.5 mm tall.
const HP = 5.08, U3 = 128.5;

const LEVELS = [
  { id:'VCO', name:'Origin', hp:10, start:0.5, goal:3.0, pulseEvery:8, scrollers:2, field:null,
    knobs:[[.5,.17,6.2,'FREQ'],[.5,.39,4.2,'FINE'],[.28,.56,3.0,'PW'],[.72,.56,3.0,'FM']],
    jacks:[[.25,.74,'1V/OCT'],[.75,.74,'SYNC'],[.2,.88,'SAW'],[.5,.88,'SQR'],[.8,.88,'OUT']],
    mix:{dust:5,solder:4,screw:2,nut:2,cap:1,led:1},
    memento:{t:'ring',name:"Ilse's ring",line:"Ilse's ring. She took it off to knead bread, and the bread outlived her."},
    intro:["Otto Brandt is eighty-four. He repaired synthesizers in Lindenau for fifty-one years. Nobody has been born in Lindenau for eleven.",
      "He fell asleep at the bench in front of the rack he built for Ilse in 1979. It has not made a sound since she died. Now he is small enough to walk inside it.",
      "<em>Roll up what's loose. Grow. When you're big enough, find the OUT jack and patch in.</em>"],
    line0:"This oscillator used to hum like a refrigerator in love. Nine years of silence. Let's see what's lying around.",
  },
  { id:'LFO', name:'Tide', hp:12, start:1.3, goal:6.5, pulseEvery:7, scrollers:4, field:'tide',
    knobs:[[.5,.2,7.0,'RATE'],[.3,.45,4.0,'SHAPE'],[.7,.45,4.0,'DEPTH']],
    jacks:[[.22,.72,'RESET'],[.5,.72,'CV'],[.78,.72,'TRI'],[.3,.88,'SQR'],[.7,.88,'OUT']],
    mix:{dust:3,solder:3,screw:3,nut:2,cap:2,res:2,led:2,heart:1},
    memento:{t:'glasses',name:'reading glasses',line:"My reading glasses. I stopped reading when the books started reading back."},
    intro:["A low-frequency oscillator. It moves slower than you can hear, the way a tide moves. Everything in here drifts with it, you included.",
      "The first scrollers live here. They don't move much. They are mostly face, and the face is mostly lit from below.",
      "<em>Ride the current or fight it. Your choice, same as always.</em>"],
    line0:"Slow modulation. Ilse said I was a slow modulation. She meant it kindly. Mostly.",
  },
  { id:'VCF', name:'Resonance', hp:16, start:2.4, goal:10, pulseEvery:6, scrollers:5, field:'peaks',
    knobs:[[.5,.17,8.0,'CUTOFF'],[.28,.42,4.6,'RES'],[.72,.42,4.6,'ENV']],
    jacks:[[.2,.7,'IN'],[.4,.7,'CV'],[.6,.7,'FM'],[.8,.7,'Q'],[.3,.87,'LP'],[.7,.87,'OUT']],
    mix:{screw:3,nut:3,cap:2,res:3,led:2,chip:2,knobcap:2,heart:2,badge:1},
    memento:{t:'photo',name:'a photograph',line:"Jonas, age six, in headphones bigger than his head. He listened to everything, then."},
    intro:["A filter decides what gets through. Turn the resonance up and it starts to ring on its own, singing at the one frequency it can't let go of.",
      "Those bright peaks are resonance. They throw you. They throw everything.",
      "<em>Somewhere in here is a photograph Otto would like back.</em>"],
    line0:"Every filter has a frequency it can't let go of. Mine is a boy with headphones.",
  },
  { id:'VCA', name:'Attenuation', hp:20, start:3.6, goal:14, pulseEvery:5, scrollers:8, field:'dark',
    knobs:[[.3,.2,6.5,'GAIN'],[.7,.2,6.5,'BIAS'],[.5,.44,5.0,'RESP']],
    jacks:[[.18,.7,'IN 1'],[.39,.7,'CV 1'],[.61,.7,'IN 2'],[.82,.7,'CV 2'],[.3,.87,'MIX'],[.7,.87,'OUT']],
    mix:{nut:2,cap:2,res:2,chip:3,knobcap:3,heart:3,badge:3,phone:2},
    memento:{t:'letter',name:'an unsent letter',line:"The letter I wrote Jonas in '49. Never sent it. I didn't have his handle."},
    intro:["A voltage-controlled amplifier only ever makes things quieter. Gain at zero is silence. This one has been at zero for a long time.",
      "It's dark in here. The only light is yours, and theirs.",
      "<em>More scrollers. More of what falls off them.</em>"],
    line0:"An amplifier that only subtracts. I know the feeling. Turn me up a little.",
  },
  { id:'OUT', name:'Release', hp:28, start:5, goal:18, pulseEvery:5, scrollers:12, field:'wake',
    knobs:[[.24,.2,7.0,'LEVEL'],[.5,.2,7.0,'VERB'],[.76,.2,7.0,'TONE']],
    jacks:[[.15,.7,'L'],[.32,.7,'R'],[.5,.7,'AUX'],[.68,.7,'SEND'],[.85,.7,'RTN'],[.5,.87,'MAIN OUT']],
    mix:{chip:2,knobcap:2,heart:3,badge:4,phone:4,cable:2},
    memento:{t:'key',name:'the shop key',line:"The key to the shop. Nobody has knocked since the last repair."},
    intro:["The output stage. Release is the last part of an envelope: the time a sound takes to die away after you let go.",
      "Everyone is here now. Bump a scroller and their phone falls. Some of them look up. One of them is Jonas.",
      "<em>Get big enough to fill the room. Then let go.</em>"],
    line0:"Release. The part of the note after you let go. I've been practising.",
  },
];

const OTTO = {
  grow:["Dust, solder, a screw from 1983. Everything I dropped finds its way back eventually.",
    "Collecting things. At my age you're supposed to be giving them away.",
    "Bigger now. Still not big enough to matter to anybody with a screen.",
    "A man is just the sum of what sticks to him.",
    "Ilse would laugh. I'm a lint ball with opinions."],
  shed:["The voltage shakes me loose. Fine. I was never attached to most of it.",
    "Gravity used to be the only thing that pushed me around.",
    "There goes a piece of me. Somebody will post about it.",
    "Everything I build comes apart. That's what makes it worth soldering."],
  ready:["That's enough of me. Find the OUT jack.","Big enough. Patch me in before I lose my nerve."],
  talk:["They used to have children. Now they have followers. Same diaper changes, fewer hugs.",
    "When I was young we stared at the sky. Now the sky has a feed, and it's mostly ads.",
    "None of them have heard a sawtooth wave in person. I find that unbearable.",
    "I said good morning. It counted as a comment."],
};

const SCROLL = [
  "hold on i'm in a space rn","is this a bit? are you a bit?","an old man touched me. posting it",
  "i'd have kids but the discourse is exhausting","ratio","i don't really do physical",
  "real life has terrible latency","the algorithm says i'm happy","do you have a link for outside",
  "why are you round","touch grass? grass got deprecated","sorry, who's your provider",
  "can you not. i'm grieving a streamer","there's a reel about this exact feeling",
  "my companion app says you're a red flag","i've never heard a sound that wasn't recommended",
  "babies are so 2030","is the sun sponsored","brb, refreshing","i'm not lonely, i'm subscribed",
];
const WOKEN = ["...oh. it's loud in here.","what is that sound?","i forgot i had hands.","is it always this bright?",
  "wait. who made that?","my battery died. what do i do now","hey. hi. hello. is that how it goes?","it's warm."];
const JONAS = {woke:"Papa? ...you shrank.", otto:"No, Jonas. You grew. I just wasn't looking either."};

const SCALE = [0,3,5,7,10]; // minor pentatonic, A
// ===== ENGINE: state, level build, physics =====
const K_MASS = 0.9;
const G = { li:0, mode:'title', t:0, keepsakes:0, lookedUp:0, jonas:false, got:[] };
let rnd = Math.random;
const rand = (a,b)=>a+(b-a)*rnd();
const pick = a=>a[(rnd()*a.length)|0];
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
function wpick(mix){ let tot=0; for(const k in mix) tot+=mix[k]; let u=rnd()*tot; for(const k in mix){ u-=mix[k]; if(u<=0) return k; } return Object.keys(mix)[0]; }
const COLS = { led:['#ff4b3a','#5cff7a','#ffb547','#6fb6ff'], knobcap:['#d94a3a','#e8e4da','#f2c230','#3a7bd9','#222'], cable:['#d94a3a','#f2c230','#3a7bd9','#e8e4da','#2fbf71'] };

function buildLevel(i){
  const L = LEVELS[i]; G.L = L; G.li = i;
  const W = L.hp*HP, H = U3; G.W=W; G.H=H;
  G.items=[]; G.att=[]; G.pulses=[]; G.scrollers=[]; G.peaks=[]; G.mass=0; G.ready=false; G.warn=null;
  G.pulseT = L.pulseEvery*0.8; G.t=0; G.talkCool=0; G.growNext=.3; G.won=false; G.readySaid=false;
  G.knobs = L.knobs.map(([x,y,r,lab])=>({x:x*W,y:y*H,r,lab,ang:rand(-2.4,2.4)}));
  G.jacks = L.jacks.map(([x,y,lab],k)=>({x:x*W,y:y*H,r:2.9,lab,out:k===L.jacks.length-1,blink:0}));
  // ball start: upper-middle open space
  const b = G.ball = {x:W*.5,y:H*.3,vx:0,vy:0,r:L.start,spin:0,hurt:0};
  for(let n=0;n<80;n++){ if(freeAt(b.x,b.y,b.r+1)) break; b.x=rand(6,W-6); b.y=rand(H*.25,H*.6); }
  // items: heavy-tailed sizes so there's always something your size
  G.kM=[.9,.75,.6,.5,.45][i]; const lo=L.start*.22, hi=L.goal*(.55-.04*i), need=(L.goal*L.goal-L.start*L.start)/G.kM*3;
  let sum=0, guard=0;
  while(sum<need && G.items.length<720 && guard++<6000){
    const s = lo*Math.pow(hi/lo, Math.pow(rnd(),1.7));
    const x=rand(4+s,W-4-s), y=rand(7+s,H-7-s);
    if(!freeAt(x,y,s+.4)) continue;
    if(Math.hypot(x-b.x,y-b.y)<b.r+s+1) continue;
    G.items.push(mkItem(wpick(L.mix),x,y,s)); sum+=s*s;
  }
  // a few extra crumbs right around the start so the first seconds feel good
  for(let n=0;n<14;n++){ const a=rand(0,6.28), d=rand(b.r*3,b.r*12), s=rand(lo,L.start*.45);
    const x=b.x+Math.cos(a)*d, y=b.y+Math.sin(a)*d; if(x>4&&x<W-4&&y>7&&y<H-7&&freeAt(x,y,s)) G.items.push(mkItem('dust',x,y,s)); }
  // keepsake, far from start
  for(let n=0;n<200;n++){ const x=rand(8,W-8), y=rand(10,H-10), s=L.start*1.15;
    if(freeAt(x,y,s+1) && Math.hypot(x-b.x,y-b.y)>H*.35){ const m=mkItem(L.memento.t,x,y,s); m.mem=true; G.items.push(m); break; } }
  // scrollers
  const sh = Math.max(L.goal*.8, L.start*3.2);
  const jIdx = L.field==='wake' ? (rnd()*L.scrollers)|0 : -1;
  for(let n=0;n<L.scrollers;n++){
    for(let k=0;k<100;k++){ const x=rand(8,W-8), y=rand(H*.2,H*.92);
      if(freeAt(x,y,sh*.4) && Math.hypot(x-b.x,y-b.y)>sh*1.5){
        G.scrollers.push({x,y,vx:0,vy:0,h:sh,cr:sh*.3,tx:x,ty:y,ph:rand(0,6),cool:0,woke:false,jonas:n===jIdx,say:'',sayT:0}); break; } }
  }
  if(L.field==='peaks') for(let n=0;n<6;n++){ for(let k=0;k<60;k++){ const x=rand(10,W-10), y=rand(H*.22,H*.85);
      if(freeAt(x,y,4)&&Math.hypot(x-b.x,y-b.y)>12){ G.peaks.push({x,y,r:2.2,ph:rand(0,6),f:rand(.7,1.4)}); break; } } }
}
function freeAt(x,y,r){
  for(const k of G.knobs) if(Math.hypot(x-k.x,y-k.y)<k.r+r+.5) return false;
  for(const j of G.jacks) if(Math.hypot(x-j.x,y-j.y)<j.r+r+.3) return false;
  return true;
}
function mkItem(t,x,y,s){
  const it={t,x,y,s,vx:0,vy:0,rot:rand(0,6.28),vr:0,seed:rnd(),cool:0};
  if(COLS[t]) it.col=pick(COLS[t]);
  return it;
}

// ----- growth / shedding -----
function recompute(){ const b=G.ball; b.r=Math.sqrt(G.L.start*G.L.start + G.kM*G.mass); }
function attach(it){
  const b=G.ball, a=Math.atan2(it.y-b.y,it.x-b.x)-b.spin;
  G.att.push({t:it.t,s:it.s,col:it.col,seed:it.seed,rot:it.rot-b.spin,ang:a,d:b.r*rand(.86,1.0),mem:it.mem});
  G.mass+=it.s*it.s; recompute();
  sfxPick(it.s/b.r, it.t);
  if(it.mem){ G.keepsakes++; G.got.push(G.L.memento.name); say('Otto',G.L.memento.line,false,6.5); }
  const p=(b.r-G.L.start)/(G.L.goal-G.L.start);
  if(!G.ready && p>=1){ G.ready=true; if(!G.readySaid){ G.readySaid=true; say('Otto',pick(OTTO.ready),false,5);} sfxReady(); }
  else if(p>G.growNext && !it.mem){ G.growNext+=.3; if(!capBusy()) say('Otto',pick(OTTO.grow)); }
}
function shed(n, ax, ay, sp){
  const b=G.ball; let out=0;
  for(let i=G.att.length-1;i>=0 && out<n;i--){
    const a=G.att[i]; if(a.d<b.r*.7 || a.mem) continue;
    G.att.splice(i,1); G.mass=Math.max(0,G.mass-a.s*a.s); out++;
    const ang=a.ang+b.spin, ox=Math.cos(ang), oy=Math.sin(ang);
    const it={t:a.t,s:a.s,col:a.col,seed:a.seed,rot:a.rot+b.spin,x:b.x+ox*(b.r+a.s+.2),y:b.y+oy*(b.r+a.s+.2),vr:rand(-8,8),cool:1.3};
    const v=sp*rand(.6,1.3); it.vx=b.vx+(ox*.7+ax*.6)*v; it.vy=b.vy+(oy*.7+ay*.6)*v;
    G.items.push(it);
  }
  if(out){ recompute(); const p=(b.r-G.L.start)/(G.L.goal-G.L.start); if(p<1 && G.ready){ G.ready=false; } b.hurt=.35; sfxShed(out); }
  return out;
}

// ----- per-frame -----
function fieldAt(x,y,t){
  if(G.L.field!=='tide') return [0,0];
  const A=G.L.start*5.5;
  return [A*Math.sin(t*.55 + y*.07), A*.7*Math.cos(t*.41 + x*.09)];
}
function update(dt){
  const b=G.ball, L=G.L, W=G.W, H=G.H; G.t+=dt;
  // input → acceleration
  const acc=17*Math.pow(b.r+.5,.62);
  b.vx+=IN.x*acc*dt; b.vy+=IN.y*acc*dt;
  const [fx,fy]=fieldAt(b.x,b.y,G.t); b.vx+=fx*dt*.9; b.vy+=fy*dt*.9;
  const damp=Math.exp(-1.7*dt); b.vx*=damp; b.vy*=damp;
  b.x+=b.vx*dt; b.y+=b.vy*dt;
  const sp=Math.hypot(b.vx,b.vy);
  b.spin += (b.vx>=0?1:-1)*sp/Math.max(b.r,.1)*dt*.8;
  b.hurt=Math.max(0,b.hurt-dt);

// brushed aluminium, screen-space
const brush=(()=>{ const c=document.createElement('canvas'); c.width=c.height=256; const g=c.getContext('2d');

const CAM={x:0,y:0,z:20};
const SX=x=>(x-CAM.x)*CAM.z+VW/2, SY=y=>(y-CAM.y)*CAM.z+VH/2;
function camUpdate(dt,snap){ const b=G.ball, zt=Math.min(VW,VH)*.052/b.r;

  const hw=VW/2/CAM.z, hh=VH/2/CAM.z; let x=b.x, y=b.y;
  x = 2*hw>=G.W ? G.W/2 : clamp(x,hw,G.W-hw); y = 2*hh>=G.H+20 ? G.H/2 : clamp(y,hh-12,G.H-hh+6);
  if(snap){CAM.x=x;CAM.y=y}else{CAM.x+=(x-CAM.x)*Math.min(1,dt*6);CAM.y+=(y-CAM.y)*Math.min(1,dt*6);} }

function drawBall(){ const b=G.ball, z=CAM.z, x=SX(b.x), y=SY(b.y), r=b.r*z;

function drawFog(){ fx.setTransform(DPR,0,0,DPR,0,0); fx.globalCompositeOperation='source-over'; fx.clearRect(0,0,VW,VH);

  const hole=(x,y,r,a)=>{ const g=fx.createRadialGradient(x,y,0,x,y,r); g.addColorStop(0,`rgba(0,0,0,${a})`); g.addColorStop(1,'rgba(0,0,0,0)'); fx.fillStyle=g; fx.beginPath(); fx.arc(x,y,r,0,7); fx.fill(); };
  const b=G.ball, z=CAM.z; hole(SX(b.x),SY(b.y),b.r*z*(6.5+.3*Math.sin(G.t*7)),1);
  for(const s of G.scrollers) hole(SX(s.x),SY(s.y-s.h*.6),s.h*z*.6,.8);
  for(const p of G.pulses) hole(SX(p.x),SY(p.y),p.R*z,.25);
  if(G.ready){ const o=G.jacks.find(j=>j.out); hole(SX(o.x),SY(o.y),o.r*z*6,.9); }
  for(const j of G.jacks) if(j.blink) hole(SX(j.x),SY(j.y),j.r*z*3,.7);

function edgeArrow(o){ const x=SX(o.x), y=SY(o.y), m=46; if(x>m&&x<VW-m&&y>m+40&&y<VH-m) return;
  const ax=clamp(x,m,VW-m), ay=clamp(y,m+50,VH-m-60), a=Math.atan2(y-ay,x-ax);
  cx.save(); cx.translate(ax,ay); cx.rotate(a); cx.fillStyle='#d94a3a'; cx.shadowColor='#d94a3a'; cx.shadowBlur=12;
  cx.beginPath(); cx.moveTo(16,0); cx.lineTo(-8,-10); cx.lineTo(-3,0); cx.lineTo(-8,10); cx.fill(); cx.restore(); }

// ----- item art (origin-centred, s = radius in px) -----
function drawItem(it,s){ const c=cx;
  switch(it.t){
  case 'dust': c.fillStyle='#77746d'; c.beginPath(); c.arc(0,0,s*.7,0,7); c.arc(s*.4,s*.2,s*.5,0,7); c.arc(-s*.3,s*.35,s*.45,0,7); c.fill(); break;
  case 'solder': { const g=c.createRadialGradient(-s*.3,-s*.3,0,0,0,s); g.addColorStop(0,'#f1f1ee'); g.addColorStop(1,'#7c7f80'); c.fillStyle=g; c.beginPath(); c.ellipse(0,0,s,s*.8,0,0,7); c.fill(); break; }
  case 'screw': c.fillStyle='#b8bbbd'; c.beginPath(); c.arc(0,0,s,0,7); c.fill(); c.strokeStyle='#2b2d2e'; c.lineWidth=Math.max(1,s*.22); c.beginPath(); c.moveTo(-s*.65,0); c.lineTo(s*.65,0); c.stroke(); break;
  case 'nut': c.fillStyle='#9c9fa1'; c.beginPath(); for(let i=0;i<6;i++) c.lineTo(Math.cos(i*1.047)*s,Math.sin(i*1.047)*s); c.fill(); c.fillStyle='#1a1b1c'; c.beginPath(); c.arc(0,0,s*.45,0,7); c.fill(); break;
  case 'cap': c.fillStyle='#161616'; c.fillRect(-s,-s*.55,s*2,s*1.1); c.fillStyle='#c9a24a'; c.fillRect(-s*.6,-s*.2,s*.4,s*.4); c.fillRect(s*.2,-s*.2,s*.4,s*.4); break;
  case 'res': c.strokeStyle='#bdbdb8'; c.lineWidth=Math.max(1,s*.12); c.beginPath(); c.moveTo(-s,0); c.lineTo(s,0); c.stroke(); c.fillStyle='#d8c39a'; c.fillRect(-s*.55,-s*.28,s*1.1,s*.56);
    ['#7a3b1f','#111','#d94a3a','#c9a24a'].forEach((k,i)=>{ c.fillStyle=k; c.fillRect(-s*.4+i*s*.24,-s*.28,s*.1,s*.56); }); break;
  case 'led': c.fillStyle=it.col; c.shadowColor=it.col; c.shadowBlur=s*1.5; c.beginPath(); c.arc(0,0,s*.8,0,7); c.fill(); c.shadowBlur=0; c.fillStyle='rgba(255,255,255,.6)'; c.beginPath(); c.arc(-s*.25,-s*.25,s*.22,0,7); c.fill(); break;
  case 'chip': c.fillStyle='#bdbdb8'; for(let i=-3;i<=3;i+=2){ c.fillRect(i*s*.17-s*.05,-s*.85,s*.1,s*1.7); } c.fillStyle='#1b1b1d'; c.fillRect(-s*.75,-s*.6,s*1.5,s*1.2); c.fillStyle='#555'; c.beginPath(); c.arc(-s*.5,-s*.35,s*.09,0,7); c.fill(); break;
  case 'knobcap': c.fillStyle=it.col; c.beginPath(); c.arc(0,0,s,0,7); c.fill(); c.strokeStyle=it.col==='#e8e4da'?'#111':'#e8e4da'; c.lineWidth=Math.max(1,s*.16); c.beginPath(); c.moveTo(0,0); c.lineTo(0,-s*.85); c.stroke(); break;
  case 'heart': c.fillStyle='#ff4a6a'; c.beginPath(); c.moveTo(0,s*.8); c.bezierCurveTo(-s*1.3,-s*.1,-s*.5,-s*1.1,0,-s*.35); c.bezierCurveTo(s*.5,-s*1.1,s*1.3,-s*.1,0,s*.8); c.fill(); break;
  case 'badge': c.fillStyle='#e8352f'; c.beginPath(); c.arc(0,0,s,0,7); c.fill(); if(s>5){ c.fillStyle='#fff'; c.font=`700 ${s*1.1}px "Barlow Condensed",sans-serif`; c.textAlign='center'; c.textBaseline='middle'; c.fillText(String(1+((it.seed*98)|0)),0,s*.06);} break;
  case 'phone': c.fillStyle='#0d0f11'; rr(-s*.55,-s,s*1.1,s*2,s*.18); c.fill(); c.fillStyle='#7fd3ff'; c.shadowColor='#7fd3ff'; c.shadowBlur=s; rr(-s*.45,-s*.85,s*.9,s*1.7,s*.1); c.fill(); c.shadowBlur=0; break;
  case 'cable': c.strokeStyle=it.col; c.lineWidth=Math.max(1,s*.22); c.lineCap='round'; c.beginPath(); c.moveTo(-s*.8,-s*.4); c.bezierCurveTo(-s*.2,s*.9,s*.3,-s*.9,s*.8,s*.4); c.stroke(); c.fillStyle='#222'; c.fillRect(-s*.95,-s*.55,s*.3,s*.3); c.fillRect(s*.65,s*.25,s*.3,s*.3); break;
  case 'ring': c.strokeStyle='#e6b84a'; c.lineWidth=Math.max(1.5,s*.28); c.beginPath(); c.arc(0,0,s*.75,0,7); c.stroke(); break;
  case 'glasses': c.strokeStyle='#c9a24a'; c.lineWidth=Math.max(1,s*.12); c.beginPath(); c.arc(-s*.48,0,s*.4,0,7); c.moveTo(s*.88,0); c.arc(s*.48,0,s*.4,0,7); c.moveTo(-s*.08,0); c.lineTo(s*.08,0); c.stroke(); c.fillStyle='rgba(200,230,255,.18)'; c.beginPath(); c.arc(-s*.48,0,s*.38,0,7); c.arc(s*.48,0,s*.38,0,7); c.fill(); break;
  case 'photo': c.fillStyle='#efe8d8'; c.fillRect(-s*.8,-s,s*1.6,s*2); c.fillStyle='#8a6a48'; c.fillRect(-s*.66,-s*.86,s*1.32,s*1.4); c.fillStyle='#3a2c20'; c.beginPath(); c.arc(0,-s*.2,s*.32,0,7); c.fill(); c.fillRect(-s*.4,s*.12,s*.8,s*.42); break;
  case 'letter': c.fillStyle='#e9e2cf'; c.fillRect(-s,-s*.65,s*2,s*1.3); c.strokeStyle='#a39a83'; c.lineWidth=Math.max(1,s*.08); c.beginPath(); c.moveTo(-s,-s*.65); c.lineTo(0,s*.1); c.lineTo(s,-s*.65); c.stroke(); break;
  case 'key': c.fillStyle='#d4a948'; c.beginPath(); c.arc(-s*.55,0,s*.42,0,7); c.fill(); c.fillRect(-s*.2,-s*.12,s*1.2,s*.24); c.fillRect(s*.6,s*.1,s*.14,s*.25); c.fillRect(s*.85,s*.1,s*.14,s*.3); c.fillStyle='#141617'; c.beginPath(); c.arc(-s*.6,0,s*.15,0,7); c.fill(); break;

}
function rr(x,y,w,h,r){ cx.beginPath(); cx.moveTo(x+r,y); cx.arcTo(x+w,y,x+w,y+h,r); cx.arcTo(x+w,y+h,x,y+h,r); cx.arcTo(x,y+h,x,y,r); cx.arcTo(x,y,x+w,y,r); cx.closePath(); }
// ===== AUDIO =====
let AC=null, OUTG=null, SEND=null, muted=false, lastPick=0; G.done=0; G.nodes=[];
function audioInit(){
  if(AC){ if(AC.state==='suspended') AC.resume(); return; }
  try{ AC=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ return; }
  const comp=AC.createDynamicsCompressor(); comp.connect(AC.destination);
  OUTG=AC.createGain(); OUTG.gain.value=muted?0:.9; OUTG.connect(comp);
  const verb=AC.createConvolver(), len=AC.sampleRate*3.2, ir=AC.createBuffer(2,len,AC.sampleRate);
  for(let ch=0;ch<2;ch++){ const d=ir.getChannelData(ch); for(let i=0;i<len;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/len,2.6); }
  verb.buffer=ir; SEND=AC.createGain(); SEND.gain.value=.35; SEND.connect(verb); verb.connect(OUTG);
  // tape hiss: the room before anything plays
  const nb=AC.createBuffer(1,AC.sampleRate*2,AC.sampleRate), nd=nb.getChannelData(0); for(let i=0;i<nd.length;i++) nd[i]=Math.random()*2-1;
  G.noise=nb; const ns=AC.createBufferSource(); ns.buffer=nb; ns.loop=true; const bp=AC.createBiquadFilter(); bp.type='bandpass'; bp.frequency.value=3200; bp.Q.value=.6;
  const ng=AC.createGain(); ng.gain.value=.012; ns.connect(bp).connect(ng).connect(OUTG); ns.start();
}
const hz=semi=>110*Math.pow(2,semi/12);
const scaleNote=(i)=>SCALE[((i%5)+5)%5]+12*Math.floor(i/5);
function env(node,a,peak,d,t0){ const g=node.gain; g.cancelScheduledValues(t0); g.setValueAtTime(0,t0); g.linearRampToValueAtTime(peak,t0+a); g.exponentialRampToValueAtTime(.0001,t0+a+d); }
function tone(type,f,peak,dur,send=.5,f2){ if(!AC) return; const t=AC.currentTime, o=AC.createOscillator(), g=AC.createGain(); o.type=type; o.frequency.setValueAtTime(f,t);
  if(f2) o.frequency.exponentialRampToValueAtTime(f2,t+dur); env(g,.004,peak,dur,t); o.connect(g); g.connect(OUTG); if(send){ const s=AC.createGain(); s.gain.value=send; g.connect(s).connect(SEND);} o.start(t); o.stop(t+dur+.05); }
function noiseHit(f,q,peak,dur){ if(!AC) return; const t=AC.currentTime, s=AC.createBufferSource(), b=AC.createBiquadFilter(), g=AC.createGain(); s.buffer=G.noise; b.type='bandpass'; b.frequency.value=f; b.Q.value=q;
  env(g,.002,peak,dur,t); s.connect(b).connect(g).connect(OUTG); g.connect(SEND); s.start(t,Math.random()); s.stop(t+dur+.05); }
function sfxPick(ratio,t){ if(!AC) return; const now=performance.now(); if(now-lastPick<45) return; lastPick=now;
  const digital = t==='phone'||t==='heart'||t==='badge';
  const idx = 14 - Math.round(ratio*10) + ((Math.random()*3)|0);
  tone(digital?'square':'triangle', hz(scaleNote(idx)+12), digital?.035:.09, digital?.09:.4, .4); }
function sfxShed(n){ noiseHit(900,.8,.18,.18); tone('sine',90,.2,.25,0,45); }
function sfxThud(v){ tone('sine',70,.25*v+.1,.3,0,38); }
function sfxPulse(){ tone('sine',220,.22,.6,.3,48); noiseHit(5000,1,.05,.05); }
function sfxPeak(){ noiseHit(1400+Math.random()*900,28,.6,.5); }
function sfxBlip(){ tone('square',1318,.03,.07,.2); setTimeout(()=>tone('square',1760,.025,.06,.2),70); }
function sfxWake(){ tone('sine',hz(24),.08,1.4,.8); setTimeout(()=>tone('sine',hz(28),.07,1.6,.8),160); }
function sfxReady(){ [0,3,7,12].forEach((s,i)=>setTimeout(()=>tone('triangle',hz(s+12),.08,.5,.6),i*90)); }
function sfxPatch(){ noiseHit(3000,2,.25,.04); tone('sine',hz(0),.12,1.8,.9); }

// the rack's voice, rebuilt one module at a time
function music(){
  if(!AC) return; const n=G.done, t=AC.currentTime, keep=x=>(G.nodes.push(x),x);
  if(n>=1 && !G.vco){ const lp=keep(AC.createBiquadFilter()); lp.type='lowpass'; lp.frequency.value=900; lp.Q.value=1;
    const g=keep(AC.createGain()); g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(.045,t+3);
    const o1=keep(AC.createOscillator()), o2=keep(AC.createOscillator()); o1.type=o2.type='sawtooth'; o1.frequency.value=55; o2.frequency.value=55.25;
    o1.connect(lp); o2.connect(lp); lp.connect(g).connect(OUTG); const s=keep(AC.createGain()); s.gain.value=.4; g.connect(s).connect(SEND); o1.start(); o2.start(); G.vco={o1,o2,lp,g}; }
  if(n>=2 && !G.lfo){ const l=keep(AC.createOscillator()); l.frequency.value=.17; const d=keep(AC.createGain()); d.gain.value=14; const d2=keep(AC.createGain()); d2.gain.value=260;
    l.connect(d); d.connect(G.vco.o1.detune); d.connect(G.vco.o2.detune); l.connect(d2).connect(G.vco.lp.frequency); l.start(); G.lfo=l; }
  if(n>=3 && !G.vcf){ G.vco.lp.Q.setTargetAtTime(7,t,1.5); const l=keep(AC.createOscillator()); l.frequency.value=.045; const d=keep(AC.createGain()); d.gain.value=700; l.connect(d).connect(G.vco.lp.frequency);
    G.vco.lp.frequency.setTargetAtTime(1100,t,1); l.start(); G.vcf=l; }
  if(n>=4 && !G.seq){ let step=0, next=AC.currentTime+.1; const pat=[0,2,4,3,5,4,2,1, 0,2,4,6,5,3,2,-1];
    G.seq=setInterval(()=>{ if(!AC) return; while(next<AC.currentTime+.25){ const p=pat[step%pat.length]; if(p>=0){ const o=AC.createOscillator(), g=AC.createGain(), f=AC.createBiquadFilter();
        o.type='triangle'; o.frequency.value=hz(scaleNote(p+5)); f.type='lowpass'; f.frequency.value=2400; env(g,.006,.07,.55,next); o.connect(f).connect(g).connect(OUTG); g.connect(SEND); o.start(next); o.stop(next+.7); }
      next+=.42; step++; } },60); }
  if(n>=5 && !G.bell){ SEND.gain.setTargetAtTime(.75,t,2); [hz(24),hz(27),hz(31),hz(36)].forEach((f,i)=>{ const o=keep(AC.createOscillator()), g=keep(AC.createGain()); o.type='sine'; o.frequency.value=f;
      g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(.018,t+4+i); o.connect(g).connect(SEND); o.start(); }); G.bell=true; }
}
function musicReset(){ for(const x of G.nodes){ try{ x.stop&&x.stop(); }catch(e){} try{ x.disconnect(); }catch(e){} } G.nodes=[]; clearInterval(G.seq);
  G.vco=G.lfo=G.vcf=G.seq=G.bell=null; if(SEND) SEND.gain.value=.35; }

// ===== INPUT =====
const IN={x:0,y:0,touch:false,ox:0,oy:0,id:null}; const KEYS=new Set();
addEventListener('keydown',e=>{ if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','w','a','s','d','W','A','S','D'].includes(e.key)){ KEYS.add(e.key.toLowerCase()); e.preventDefault(); keyIn(); } });
addEventListener('keyup',e=>{ KEYS.delete(e.key.toLowerCase()); keyIn(); });
function keyIn(){ if(IN.touch) return; let x=0,y=0; if(KEYS.has('arrowleft')||KEYS.has('a')) x--; if(KEYS.has('arrowright')||KEYS.has('d')) x++; if(KEYS.has('arrowup')||KEYS.has('w')) y--; if(KEYS.has('arrowdown')||KEYS.has('s')) y++;
  const m=Math.hypot(x,y)||1; IN.x=x/m; IN.y=y/m; }
cv.addEventListener('pointerdown',e=>{ if(G.mode!=='play') return; IN.touch=true; IN.id=e.pointerId; IN.ox=e.clientX; IN.oy=e.clientY; IN.x=IN.y=0; cv.setPointerCapture(e.pointerId); });
cv.addEventListener('pointermove',e=>{ if(!IN.touch||e.pointerId!==IN.id) return; let dx=(e.clientX-IN.ox)/56, dy=(e.clientY-IN.oy)/56; const m=Math.hypot(dx,dy);
  if(m>1){ IN.ox+=(dx/m)*(m-1)*56; IN.oy+=(dy/m)*(m-1)*56; dx/=m; dy/=m; } IN.x=dx; IN.y=dy; });
const endTouch=e=>{ if(e.pointerId!==IN.id) return; IN.touch=false; IN.x=IN.y=0; keyIn(); };
cv.addEventListener('pointerup',endTouch); cv.addEventListener('pointercancel',endTouch);

const HEARD=["A sawtooth. Two of them, a quarter-hertz apart, beating against each other like an old couple sharing a bed.",

function endCard(){

  card(`<div class="kicker"><span>Main out</span><span>Release: long</span></div>
    <h2 class="ctitle">Release</h2>
    <div class="cbody"><p>The rack plays. Sawtooth, tide, resonance, a small melody gated on and off, all of it washing out through the main outs into a room nobody has visited in years.</p>
    <p>${p2}</p><p>${p3}</p><p>${p4}</p></div>
    <dl class="specs"><dt>Looked up</dt><dd>${n} / ${tot}</dd><dt>Keepsakes</dt><dd>${k} / 5</dd><dt>Final Ø</dt><dd>${(G.ball.r*2).toFixed(1)} mm</dd></dl>`,
    'Play again', ()=>{ musicReset(); Object.assign(G,{keepsakes:0,lookedUp:0,jonas:false,got:[],done:0}); introCard(0); }, 'The patch keeps playing');
}

// ===== HUD + LOOP =====
const $=id=>document.getElementById(id); const H_MOD=$('mod'), H_TXT=$('meterTxt'), H_FILL=$('fill'), H_TK=$('tk'), H_TU=$('tu');
$('mute').onclick=()=>{ audioInit(); muted=!muted; if(OUTG) OUTG.gain.setTargetAtTime(muted?0:.9,AC.currentTime,.05); $('mute').textContent=muted?'Muted':'Sound'; };
function hud(){ const b=G.ball, L=G.L, p=clamp((b.r-L.start)/(L.goal-L.start),0,1);
  H_MOD.innerHTML=`<b>${L.id}</b> · ${L.hp}HP`;
  H_TXT.innerHTML = G.ready ? `<b>Ø ${(b.r*2).toFixed(1)} mm</b> · roll into OUT` : `Ø <b>${(b.r*2).toFixed(1)}</b> mm / ${(L.goal*2).toFixed(1)} mm`;
  H_FILL.style.width=(p*100).toFixed(1)+'%'; H_FILL.classList.toggle('ready',G.ready); H_TK.textContent=G.keepsakes; H_TU.textContent=G.lookedUp; }
let last=performance.now();
function frame(now){ const dt=Math.min(.05,(now-last)/1000); last=now;
  if(G.mode==='play'){ update(dt); hud(); camUpdate(dt); } else if(G.L){ G.t+=dt*.3; }
  if(capT>0){ capT-=dt; if(capT<=0) CAP.classList.remove('on'); }
  if(G.L) render(); requestAnimationFrame(frame); }
document.fonts && document.fonts.ready.then(()=>{});
buildLevel(0); camUpdate(0,true); titleCard(); requestAnimationFrame(frame);
</script>
</body>
</html>
